name: Build CopperBSD ISO

# Zero local setup: this provisions a real FreeBSD 15.x VM inside the runner,
# builds the CopperBSD live ISO, and uploads it as an artifact. No FreeBSD host
# is required from you — triggering this workflow IS the build.

on:
  workflow_dispatch:
    inputs:
      from_source:
        description: "1 = buildworld from pinned FreeBSD source (slow); 0 = 15.1 release sets (fast)"
        default: "0"
        required: true
  push:
    paths:
      - "build/**"
      - "release/**"
      - "overlays/**"
      - "installer/**"
      - "project/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Build the ISO inside a FreeBSD 15.x VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          # buildworld/pkg need space + RAM
          mem: 8192
          cpu: 4
          # The action's own copy-back is one rsync of the whole workspace with
          # no retry; the ssh link to the VM dropped mid-ISO on 2 of 5 builds
          # (2026-11-10, 2026-11-13: "connection unexpectedly closed", code 12)
          # and the whole ~1 h build was lost. The next step copies only the ISO,
          # resumable and retried.
          copyback: false
          prepare: |
            pkg install -y git cmake ninja pkgconf
          run: |
            set -e
            export FROM_SOURCE="${{ github.event.inputs.from_source || '0' }}"
            sh build/in-vm-build.sh

      - name: Copy the ISO back from the VM (resumable, retried)
        run: |
          mkdir -p build/output
          for i in 1 2 3 4 5; do
            if rsync -a --partial --append-verify --timeout=120 \
                 --rsync-path=/usr/local/bin/rsync \
                 -e "ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8" \
                 "freebsd:$GITHUB_WORKSPACE/build/output/" build/output/; then
              ls -l build/output
              exit 0
            fi
            echo "copy attempt $i failed; resuming in 20 s"
            sleep 20
          done
          exit 1

      - name: Validate the ISO
        run: |
          # the runner's GNU tar cannot read an ISO; bsdtar can
          command -v bsdtar >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libarchive-tools
          }
          sh tests/iso-validate.sh build/output/*.iso

      - name: Upload ISO + checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CopperBSD-ISO
          path: |
            build/output/*.iso
            build/output/*.iso.sha256
          if-no-files-found: error

      # Structure is not enough: a valid-looking ISO stopped at a text login
      # for ten releases. Boot it and require the installer to be running.
      - name: Boot-test the ISO (installer must start)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf
          sh tests/ci-boot-test.sh build/output/*.iso 900
