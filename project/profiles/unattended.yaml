meta:
  installer: freebsd-media-setup-with-dash
  note: |
    Hands-off first-boot profile used by copperbsd_firstboot. The whole media
    stack comes up with zero interaction, including the VPN jail and the
    download apps behind it (qBittorrent, Sonarr, Radarr). Those three have NO
    internet access until you give the VPN jail a WireGuard config: open the
    dashboard, VPN -> Change provider, and paste the .conf file from your
    provider (or your own server). Until then the kill-switch keeps them
    offline rather than letting them use your real address.
    Nextcloud is off; set use_nextcloud: true and re-run the installer to add
    it. Everything in this file is non-secret; generated passwords are saved by
    the installer to /root/.config/freebsd-media-setup/profile-used.yaml
    (root only).

user: copper
lan_ip: ""                 # auto-detected at first boot if blank
lan_cidr: 192.168.1.0/24
host_ip: ""
jail_subnet: 10.17.0
jail_release: 15.1-RELEASE
timezone: Europe/London

domain: ""
jellyfin_public_url: ""
nextcloud_domain: ""

media_pool: /mnt/storage    # created on first boot (a zroot/media dataset)
nextcloud_data: /mnt/nextcloud-data

use_media_stack: true
use_vpn_stack: true       # jails + kill-switch now; the WireGuard config later
use_nextcloud: false
use_dashboard: true       # the backend of CopperBSD's native dashboard
use_daily_routine: true
use_alerts: false

qbit_user: admin
qbit_password: ""          # generated

# left blank/disabled above; present so the schema validates
nc_admin_user: admin
nc_admin_password: ""
nc_db_password: ""
wg_private_key: ""
wg_address: 10.2.0.2/32
wg_dns: 10.2.0.1
wg_peer_public_key: ""
wg_endpoint: ""                 # host:port, verbatim from the provider's config
wg_preshared_key: ""            # optional (PresharedKey in the config, if any)
vpn_provider: ""                # name the dashboard shows, e.g. "Mullvad" or
                                # "Home server" (your own WireGuard server works
                                # too); blank = guessed from the endpoint
