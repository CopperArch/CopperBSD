#!/bin/sh
# desktops.conf — desktop/session package groups for CopperBSD, sourced by the
# installer backend and the desktop build test. Real FreeBSD pkg origins/names
# (verified on FreshPorts, 2026-10). Keep groups sensible — never "install all
# of KDE". The installer maps the chosen session to desktop_pkgs().
#
# Pinned port versions recorded for traceability (installed binaries track the
# pkg repo at build time; these are the versions this distro targets):
#   x11-wm/niri      26.04_6     (2026-09-08, commit 7316461, maint lme@)
#   x11/quickshell   (upstream has first-class FreeBSD support)
#   x11-wm/mango     0.17.4      (MangoWC; the port was renamed from mangowc)
#   x11-toolkits/wlroots020, graphics/qt6-wayland, x11/waybar — all present

# ── shared Wayland/graphics core (every Wayland session needs this) ─────────
WAYLAND_CORE="wayland wayland-protocols seatd libudev-devd \
    mesa-libs mesa-dri libglvnd \
    xorg-vfbserver xwayland \
    drm-kmod"

# input + session helpers used across the tiling sessions
WL_UTILS="foot swaybg pcmanfm-qt fuzzel mako swayidle swaylock wl-clipboard grim slurp \
    wlr-randr pavucontrol-qt networkmgr adwaita-icon-theme"

# ── login manager (one for all sessions) ────────────────────────────────────
# SDDM lists every /usr/local/share/{wayland-sessions,xsessions} entry, so one
# login manager presents all five. (GNOME would prefer GDM; SDDM launches the
# GNOME session fine and keeps a single, consistent greeter.)
LOGIN_MGR="sddm"

# ── KDE Plasma (grouped, not the whole ecosystem) ───────────────────────────
KDE_BASE="plasma6-plasma kde-baseapps konsole dolphin sddm"
KDE_FULL="kde sddm"
KDE_DEV="kdevelop qt6-base qt6-declarative cmake ninja"
KDE_APPS="kate gwenview okular ark plasma6-spectacle"

# ── GNOME (FreeBSD native packaging) ────────────────────────────────────────
GNOME_DE="gnome gnome-shell gnome-session gnome-terminal nautilus gnome-control-center"

# ── XFCE ────────────────────────────────────────────────────────────────────
XFCE_DE="xfce xfce4-goodies thunar xfce4-panel xfce4-settings \
    xfce4-notifyd xfce4-power-manager"

# ── Niri (scrollable-tiling Wayland) + QuickShell ───────────────────────────
NIRI_DE="niri quickshell xwayland-satellite"

# ── MangoWC (dwl/wlroots tiling) + QuickShell ───────────────────────────────
MANGOWC_DE="mango quickshell xwayland-satellite"

# ── map a session key to its package list (echoes space-separated pkgs) ─────
desktop_pkgs() {
    _wl="$WAYLAND_CORE"
    case "$1" in
        kde|kde-plasma|kde-full) echo "$LOGIN_MGR $KDE_FULL $_wl" ;;
        kde-base)                echo "$LOGIN_MGR $KDE_BASE $_wl" ;;
        gnome)                   echo "$LOGIN_MGR $GNOME_DE $_wl" ;;
        xfce)                    echo "$LOGIN_MGR $XFCE_DE $_wl" ;;
        niri|niri-quickshell)    echo "$LOGIN_MGR $NIRI_DE $WL_UTILS $_wl" ;;
        mangowc|mangowc-quickshell) echo "$LOGIN_MGR $MANGOWC_DE $WL_UTILS $_wl" ;;
        all)                     echo "$LOGIN_MGR $KDE_FULL $GNOME_DE $XFCE_DE \
                                       $NIRI_DE $MANGOWC_DE $WL_UTILS $_wl" ;;
        *)                       echo "$LOGIN_MGR $KDE_FULL $_wl" ;;  # default KDE
    esac
}

# rc knobs every graphical + Wayland session needs on FreeBSD (no systemd):
#   seatd  — seat management (replaces logind/elogind for wlroots/niri)
#   dbus   — session/system bus
#   sddm   — greeter
DESKTOP_RC="seatd_enable=YES dbus_enable=YES sddm_enable=YES moused_enable=YES"
