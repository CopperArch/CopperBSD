# NOTE: OPTIONAL stock-release path (classic bsdinstall disc via release.sh).
# The DEFAULT, live graphical build is build/in-vm-build.sh (driven by build.sh).

# release.conf — build CopperArch Media as a custom FreeBSD 15.1 release.
#
# This is consumed by src/release/release.sh on a FreeBSD host. It pins the
# build to the exact releng/15.1 commit this project was verified against,
# then extra_chroot_setup() bakes KDE Plasma, Qt, the graphical installer and
# this project into the release — producing a live ISO that boots straight into
# the CopperArch graphical installer (Anaconda/Calamares-style), which installs
# onto ZFS using FreeBSD's own bsdinstall backend.
#
#   sudo sh /usr/src/release/release.sh -c /path/to/release.conf
#
# Requires a FreeBSD 15.x build host (buildworld/buildkernel + pkg + network).
# It cannot run on Linux.

# ── where the build happens ─────────────────────────────────────────────────
CHROOTDIR="/scratch/copperarch"

# ── source: pin to the verified 15.1 commit ─────────────────────────────────
# git.freebsd.org is authoritative; the GitHub mirror (freebsd/freebsd-src) is
# identical if your build host can't reach git.freebsd.org.
GITROOT="https://git.freebsd.org/"
GITSRC="src.git"
SRCBRANCH="releng/15.1"
# release.sh checks out SRCBRANCH; there is no native "pin to commit" knob, so
# build-release.sh does the exact-commit checkout below after release.sh clones.
COPPERARCH_SRC_COMMIT="e38a7085f3a8ecd317c947591fe42b5ca9ab317b"

# ── what to build ───────────────────────────────────────────────────────────
KERNEL="GENERIC"
NODOC=yes
NOPORTS=yes            # we install binary pkgs in the chroot instead
WITH_DVD=
WITH_VMIMAGES=
TARGET=amd64
TARGET_ARCH=amd64

# Where this project lives on the build host (copied into the release).
: ${COPPERARCH_PROJECT:="/usr/local/src/freebsd-media-setup-with-dash"}

# ── bake the desktop + installer + project into the release ─────────────────
# release.sh calls this inside the release chroot after installworld. Network
# and pkg are available here.
extra_chroot_setup() {
	# pkg + the desktop and installer runtime/build deps
	env ASSUME_ALWAYS_YES=YES pkg bootstrap -f
	env ASSUME_ALWAYS_YES=YES pkg install -y \
		kde6 sddm xorg drm-kmod \
		qt6-base qt6-declarative qt6-quickcontrols2 \
		cmake ninja pkgconf \
		git python311 py311-yaml bastille

	# Bring the project into the image.
	mkdir -p /usr/local/freebsd-media-setup
	if [ -d "${COPPERARCH_PROJECT}" ]; then
		cp -a "${COPPERARCH_PROJECT}/." /usr/local/freebsd-media-setup/
	else
		git clone --depth 1 \
			https://github.com/CopperArch/freebsd-media-setup-with-dash.git \
			/usr/local/freebsd-media-setup || true
	fi

	# Build + install the Qt graphical installer.
	gui=/usr/local/freebsd-media-setup/installer/gui
	if [ -f "$gui/CMakeLists.txt" ]; then
		cmake -S "$gui" -B /tmp/gui-build -G Ninja \
			-DCMAKE_BUILD_TYPE=Release \
			-DCMAKE_INSTALL_PREFIX=/usr/local
		cmake --build /tmp/gui-build
		cmake --install /tmp/gui-build
		install -m 0755 "$gui/backend/copperarch-install.sh" \
			/usr/local/libexec/copperarch-install.sh
		rm -rf /tmp/gui-build
	fi

	# Lay the live overlay (autologin + installer autostart + live marker).
	if [ -d /usr/local/freebsd-media-setup/dist/overlay ]; then
		cp -a /usr/local/freebsd-media-setup/dist/overlay/. /
	fi

	# Desktop services for the live session.
	sysrc dbus_enable=YES
	sysrc sddm_enable=YES
	sysrc moused_enable=YES
	sysrc zfs_enable=YES

	# Mark this as a live installer environment (the GUI checks for this).
	touch /etc/copperarch-live
}
