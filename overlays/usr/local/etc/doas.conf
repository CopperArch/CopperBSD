# Live medium only: the installer GUI runs as the unprivileged "live" user and
# needs root for exactly one thing -- the backend script that partitions disks
# and installs the system. Nothing else is permitted.
permit nopass live as root cmd /usr/local/libexec/copperbsd-install.sh
permit nopass live as root cmd /usr/local/libexec/copperarch-install.sh
