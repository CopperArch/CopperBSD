# Live ISO only: auto-login a disposable 'live' user straight into the
# installer via a minimal `cage` kiosk session -- no full desktop is baked
# into the live medium (keeps the ISO small; the chosen desktop is
# pkg-installed onto the target at install time, see packages/desktops.conf).
# This file is NOT copied to the installed system (the installer only
# transfers the project directory).
[Autologin]
User=live
Session=copperarch-installer-x11.desktop
Relogin=true

[General]
DisplayServer=x11

[X11]
ServerArguments=-nolisten tcp -config /var/run/copperarch-xorg.conf
