# Live medium: mirror the console to the first serial port too, so headless
# and VM boots can be watched and debugged.
console="vidconsole,comconsole"

# Ask for a 1080p framebuffer (UEFI GOP and BIOS VBE respectively); the loader
# falls back to the firmware default where the mode isn't offered.
efi_max_resolution="1080p"
kern.vt.fb.default_mode="1920x1080"
